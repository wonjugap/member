<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 원주시당 당원관리시스템 - 보안 강화</title>
    
    <!-- Crypto-JS 라이브러리 추가 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        
        .security-header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            color: white;
            border-radius: 10px;
        }
        
        .login-form {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        input[type="text"], input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }
        
        .security-info {
            background: #e8f4fd;
            border-left: 4px solid #1976d2;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .session-info {
            display: none;
            background: #f1f8e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
        }
        
        .error-message {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            color: #d32f2f;
        }
        
        .success-message {
            background: #f1f8e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            margin: 20px 0;
            border-radius: 0 8px 8px 0;
            color: #2e7d32;
        }
        
        .demo-section {
            margin-top: 30px;
            padding: 20px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        
        .demo-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        
        .demo-buttons button {
            flex: 1;
            min-width: 150px;
            padding: 10px;
            background: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .demo-buttons button:hover {
            background: #5a6268;
        }
        
        .log-display {
            background: #2d3748;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            margin: 15px 0;
        }
        
        .password-requirements {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        
        .session-timer {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="session-timer" id="sessionTimer"></div>
    
    <div class="container">
        <div class="security-header">
            <h1>🔒 보안 강화된 당원 관리 시스템</h1>
            <p>비밀번호 해싱 + 세션 토큰 + 데이터 암호화</p>
        </div>
        
        <!-- 로그인 폼 -->
        <div class="login-form" id="loginSection">
            <h3>🔐 보안 로그인</h3>
            
            <div class="form-group">
                <label for="username">사용자 ID</label>
                <input type="text" id="username" placeholder="사용자 ID를 입력하세요">
            </div>
            
            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요">
                <div class="password-requirements">
                    * 최소 8자, 대소문자, 숫자, 특수문자 포함
                </div>
            </div>
            
            <button class="btn" onclick="login()">🔐 로그인</button>
            
            <div class="security-info">
                <strong>🛡️ 보안 기능:</strong><br>
                • PBKDF2 비밀번호 해싱 (10,000회 반복)<br>
                • 256비트 세션 토큰 (2시간 만료)<br>
                • AES-256 데이터 암호화<br>
                • 실시간 보안 로그
            </div>
        </div>
        
        <!-- 로그인 후 대시보드 -->
        <div id="dashboard" style="display: none;">
            <div class="session-info" id="sessionInfo">
                <strong>✅ 로그인 성공!</strong><br>
                <span id="userInfo"></span><br>
                <span id="sessionDetails"></span>
            </div>
            
            <div class="demo-section">
                <h3>🔧 보안 기능 테스트</h3>
                
                <div class="demo-buttons">
                    <button onclick="createUser()">👤 새 사용자 생성</button>
                    <button onclick="changePassword()">🔑 비밀번호 변경</button>
                    <button onclick="encryptTestData()">🔐 데이터 암호화</button>
                    <button onclick="showSecurityLogs()">📋 보안 로그</button>
                    <button onclick="logout()">🚪 로그아웃</button>
                </div>
                
                <div id="actionResult"></div>
            </div>
        </div>
        
        <!-- 에러 메시지 -->
        <div id="errorMessage" style="display: none;"></div>
        
        <!-- 로그 디스플레이 -->
        <div id="logDisplay" class="log-display" style="display: none;"></div>
    </div>

    <script>
        // 🔐 보안 관리 클래스
        class SecurityManager {
            constructor() {
                this.currentUser = null;
                this.sessionToken = null;
                this.sessionExpiry = null;
                this.masterKey = 'wonju_minjoo_2024_secure_key';
                this.securityLogs = [];
                this.sessionCheckInterval = null;
                
                // 즉시 기본 사용자 생성
                this.createDefaultUsers();
                this.startSessionMonitoring();
            }
            
            // 🚀 간단하고 확실한 기본 사용자 생성
            createDefaultUsers() {
                console.log('🔧 기본 사용자 생성 시작...');
                
                // 기존 데이터 완전 삭제
                localStorage.removeItem('secure_users');
                localStorage.removeItem('temp_users');
                
                // 새로운 기본 사용자 생성 (암호화 없이 먼저 테스트)
                const defaultUsers = {
                    admin: {
                        password: 'admin', // 일단 평문으로 테스트
                        permissions: ['all'],
                        createdAt: new Date().toISOString(),
                        lastLogin: null,
                        isSimple: true
                    },
                    test: {
                        password: 'test123',
                        permissions: ['basic'],
                        createdAt: new Date().toISOString(),
                        lastLogin: null,
                        isSimple: true
                    }
                };
                
                // 평문으로 저장 (테스트용)
                localStorage.setItem('simple_users', JSON.stringify(defaultUsers));
                
                console.log('✅ 기본 사용자 생성 완료:');
                console.log('📋 계정 목록:');
                console.log('1. admin / admin (관리자)');
                console.log('2. test / test123 (일반 사용자)');
                
                this.logSecurityEvent('USERS_CREATED', '기본 사용자 계정들이 생성됨');
            }
            
            // 🔒 비밀번호 해싱 관련 함수들
            generateSalt() {
                return CryptoJS.lib.WordArray.random(128/8).toString();
            }
            
            hashPassword(password, salt) {
                return CryptoJS.PBKDF2(password, salt, {
                    keySize: 256/32,
                    iterations: 10000
                }).toString();
            }
            
            // 🎫 세션 토큰 관련 함수들
            generateSessionToken() {
                return CryptoJS.lib.WordArray.random(256/8).toString();
            }
            
            createSession(username) {
                this.currentUser = username;
                this.sessionToken = this.generateSessionToken();
                this.sessionExpiry = Date.now() + (2 * 60 * 60 * 1000); // 2시간
                
                this.logSecurityEvent('SESSION_CREATED', `사용자 ${username} 로그인 성공`);
                this.updateSessionTimer();
            }
            
            isSessionValid() {
                if (!this.sessionToken || !this.sessionExpiry) {
                    return false;
                }
                
                if (Date.now() > this.sessionExpiry) {
                    this.logSecurityEvent('SESSION_EXPIRED', `세션 만료: ${this.currentUser}`);
                    this.destroySession();
                    return false;
                }
                
                return true;
            }
            
            destroySession() {
                this.logSecurityEvent('SESSION_DESTROYED', `사용자 ${this.currentUser} 로그아웃`);
                this.currentUser = null;
                this.sessionToken = null;
                this.sessionExpiry = null;
                
                if (this.sessionCheckInterval) {
                    clearInterval(this.sessionCheckInterval);
                }
                
                document.getElementById('sessionTimer').style.display = 'none';
            }
            
            // 🔐 데이터 암호화 관련 함수들 (나중에 사용)
            encryptData(data, key = this.masterKey) {
                try {
                    const jsonData = JSON.stringify(data);
                    return CryptoJS.AES.encrypt(jsonData, key).toString();
                } catch (error) {
                    this.logSecurityEvent('ENCRYPTION_ERROR', `암호화 실패: ${error.message}`);
                    throw new Error('데이터 암호화에 실패했습니다.');
                }
            }
            
            decryptData(encryptedData, key = this.masterKey) {
                try {
                    const bytes = CryptoJS.AES.decrypt(encryptedData, key);
                    const decryptedData = bytes.toString(CryptoJS.enc.Utf8);
                    return JSON.parse(decryptedData);
                } catch (error) {
                    this.logSecurityEvent('DECRYPTION_ERROR', `복호화 실패: ${error.message}`);
                    throw new Error('데이터 복호화에 실패했습니다.');
                }
            }
            
            // 📝 보안 로그 관리
            logSecurityEvent(event, message) {
                const logEntry = {
                    timestamp: new Date().toISOString(),
                    event: event,
                    message: message,
                    user: this.currentUser,
                    sessionToken: this.sessionToken ? this.sessionToken.substring(0, 8) + '...' : null,
                    userAgent: navigator.userAgent.substring(0, 50) + '...'
                };
                
                this.securityLogs.push(logEntry);
                console.log(`[SECURITY] ${event}: ${message}`);
                
                // 로그 크기 제한 (최근 100개만 유지)
                if (this.securityLogs.length > 100) {
                    this.securityLogs = this.securityLogs.slice(-100);
                }
            }
            
            // 🔍 간단한 인증 (평문 버전)
            authenticateUser(username, password) {
                console.log(`🔍 로그인 시도: ${username} / ${password}`);
                
                try {
                    // 간단한 사용자 데이터 로드
                    const usersData = localStorage.getItem('simple_users');
                    if (!usersData) {
                        console.log('❌ 사용자 데이터가 없습니다.');
                        return { success: false, message: '사용자 데이터를 찾을 수 없습니다.' };
                    }
                    
                    const users = JSON.parse(usersData);
                    console.log('📋 사용 가능한 사용자:', Object.keys(users));
                    
                    if (!users[username]) {
                        console.log(`❌ 사용자 ${username}을(를) 찾을 수 없습니다.`);
                        this.logSecurityEvent('LOGIN_FAILED', `존재하지 않는 사용자: ${username}`);
                        return { success: false, message: '사용자 ID 또는 비밀번호가 잘못되었습니다.' };
                    }
                    
                    const user = users[username];
                    console.log(`🔑 입력된 비밀번호: "${password}"`);
                    console.log(`🔑 저장된 비밀번호: "${user.password}"`);
                    console.log(`🔍 비밀번호 일치: ${password === user.password}`);
                    
                    if (password === user.password) {
                        // 로그인 시간 업데이트
                        user.lastLogin = new Date().toISOString();
                        users[username] = user;
                        localStorage.setItem('simple_users', JSON.stringify(users));
                        
                        this.createSession(username);
                        console.log('✅ 로그인 성공!');
                        return { 
                            success: true, 
                            message: '로그인 성공!', 
                            user: user 
                        };
                    } else {
                        console.log('❌ 비밀번호가 일치하지 않습니다.');
                        this.logSecurityEvent('LOGIN_FAILED', `비밀번호 불일치: ${username}`);
                        return { success: false, message: '사용자 ID 또는 비밀번호가 잘못되었습니다.' };
                    }
                } catch (error) {
                    console.error('❌ 인증 오류:', error);
                    this.logSecurityEvent('AUTH_ERROR', `인증 오류: ${error.message}`);
                    return { success: false, message: `인증 중 오류: ${error.message}` };
                }
            }
            
            // 🆕 새 사용자 생성 (간단 버전)
            createNewUser(username, password, permissions = []) {
                try {
                    if (password.length < 4) {
                        return { success: false, message: '비밀번호는 최소 4자 이상이어야 합니다.' };
                    }
                    
                    const usersData = localStorage.getItem('simple_users');
                    const users = usersData ? JSON.parse(usersData) : {};
                    
                    if (users[username]) {
                        return { success: false, message: '이미 존재하는 사용자 ID입니다.' };
                    }
                    
                    users[username] = {
                        password: password, // 평문 저장 (간단 버전)
                        permissions: permissions,
                        createdAt: new Date().toISOString(),
                        createdBy: this.currentUser,
                        lastLogin: null,
                        isSimple: true
                    };
                    
                    localStorage.setItem('simple_users', JSON.stringify(users));
                    this.logSecurityEvent('USER_CREATED', `새 사용자 생성: ${username}`);
                    
                    return { success: true, message: '사용자가 성공적으로 생성되었습니다.' };
                } catch (error) {
                    this.logSecurityEvent('USER_CREATE_ERROR', `사용자 생성 실패: ${error.message}`);
                    return { success: false, message: '사용자 생성 중 오류가 발생했습니다.' };
                }
            }
            
            // 🔑 비밀번호 변경 (간단 버전)
            changeUserPassword(username, newPassword) {
                try {
                    if (newPassword.length < 4) {
                        return { success: false, message: '비밀번호는 최소 4자 이상이어야 합니다.' };
                    }
                    
                    const usersData = localStorage.getItem('simple_users');
                    if (!usersData) {
                        return { success: false, message: '사용자 데이터를 찾을 수 없습니다.' };
                    }
                    
                    const users = JSON.parse(usersData);
                    if (!users[username]) {
                        return { success: false, message: '사용자를 찾을 수 없습니다.' };
                    }
                    
                    users[username].password = newPassword;
                    users[username].passwordChanged = new Date().toISOString();
                    users[username].passwordChangedBy = this.currentUser;
                    
                    localStorage.setItem('simple_users', JSON.stringify(users));
                    this.logSecurityEvent('PASSWORD_CHANGED', `비밀번호 변경: ${username}`);
                    
                    return { success: true, message: '비밀번호가 성공적으로 변경되었습니다.' };
                } catch (error) {
                    this.logSecurityEvent('PASSWORD_CHANGE_ERROR', `비밀번호 변경 실패: ${error.message}`);
                    return { success: false, message: '비밀번호 변경 중 오류가 발생했습니다.' };
                }
            }'ID 또는 비밀번호가 잘못되었습니다.' };
                    }
                    
                    const user = users[username];
                    console.log('사용자 정보:', {
                        hasSalt: !!user.salt,
                        hasPassword: !!user.password,
                        permissions: user.permissions
                    });
                    
                    const hashedInput = this.hashPassword(password, user.salt);
                    console.log('입력된 비밀번호 해시:', hashedInput);
                    console.log('저장된 비밀번호 해시:', user.password);
                    console.log('해시 일치 여부:', hashedInput === user.password);
                    
                    if (hashedInput === user.password) {
                        // 로그인 시간 업데이트
                        user.lastLogin = new Date().toISOString();
                        users[username] = user;
                        this.saveEncryptedData('secure_users', users);
                        
                        this.createSession(username);
                        console.log('✅ 로그인 성공');
                        return { success: true, message: '로그인 성공', user: user };
                    } else {
                        console.log('❌ 비밀번호 불일치');
                        this.logSecurityEvent('LOGIN_FAILED', `비밀번호 불일치: ${username}`);
                        return { success: false, message: '사용자 ID 또는 비밀번호가 잘못되었습니다.' };
                    }
                } catch (error) {
                    console.error('❌ 인증 오류:', error);
                    this.logSecurityEvent('AUTH_ERROR', `인증 오류: ${error.message}`);
                    return { success: false, message: `인증 중 오류가 발생했습니다: ${error.message}` };
                }
            }
            
            createNewUser(username, password, permissions = []) {
                try {
                    const validation = this.validatePassword(password);
                    if (!validation.valid) {
                        return { success: false, message: `비밀번호 요구사항: ${validation.errors.join(', ')}` };
                    }
                    
                    const users = this.loadEncryptedData('secure_users') || {};
                    if (users[username]) {
                        return { success: false, message: '이미 존재하는 사용자 ID입니다.' };
                    }
                    
                    const salt = this.generateSalt();
                    users[username] = {
                        salt: salt,
                        password: this.hashPassword(password, salt),
                        permissions: permissions,
                        createdAt: new Date().toISOString(),
                        createdBy: this.currentUser,
                        lastLogin: null
                    };
                    
                    this.saveEncryptedData('secure_users', users);
                    this.logSecurityEvent('USER_CREATED', `새 사용자 생성: ${username}`);
                    
                    return { success: true, message: '사용자가 성공적으로 생성되었습니다.' };
                } catch (error) {
                    this.logSecurityEvent('USER_CREATE_ERROR', `사용자 생성 실패: ${error.message}`);
                    return { success: false, message: '사용자 생성 중 오류가 발생했습니다.' };
                }
            }
            
            changeUserPassword(username, newPassword) {
                try {
                    const validation = this.validatePassword(newPassword);
                    if (!validation.valid) {
                        return { success: false, message: `비밀번호 요구사항: ${validation.errors.join(', ')}` };
                    }
                    
                    const users = this.loadEncryptedData('secure_users');
                    if (!users || !users[username]) {
                        return { success: false, message: '사용자를 찾을 수 없습니다.' };
                    }
                    
                    const newSalt = this.generateSalt();
                    users[username].salt = newSalt;
                    users[username].password = this.hashPassword(newPassword, newSalt);
                    users[username].passwordChanged = new Date().toISOString();
                    users[username].passwordChangedBy = this.currentUser;
                    
                    this.saveEncryptedData('secure_users', users);
                    this.logSecurityEvent('PASSWORD_CHANGED', `비밀번호 변경: ${username}`);
                    
                    return { success: true, message: '비밀번호가 성공적으로 변경되었습니다.' };
                } catch (error) {
                    this.logSecurityEvent('PASSWORD_CHANGE_ERROR', `비밀번호 변경 실패: ${error.message}`);
                    return { success: false, message: '비밀번호 변경 중 오류가 발생했습니다.' };
                }
            }
            
            // ⏰ 세션 모니터링
            startSessionMonitoring() {
                this.sessionCheckInterval = setInterval(() => {
                    if (this.currentUser && !this.isSessionValid()) {
                        this.handleSessionExpiry();
                    }
                    this.updateSessionTimer();
                }, 1000); // 1초마다 체크
            }
            
            updateSessionTimer() {
                const timerElement = document.getElementById('sessionTimer');
                if (!this.currentUser || !this.sessionExpiry) {
                    timerElement.style.display = 'none';
                    return;
                }
                
                const remaining = Math.max(0, this.sessionExpiry - Date.now());
                const minutes = Math.floor(remaining / 60000);
                const seconds = Math.floor((remaining % 60000) / 1000);
                
                timerElement.textContent = `세션 만료: ${minutes}:${seconds.toString().padStart(2, '0')}`;
                timerElement.style.display = 'block';
                
                // 5분 이하일 때 경고 색상
                if (minutes < 5) {
                    timerElement.style.background = '#f44336';
                } else {
                    timerElement.style.background = '#333';
                }
            }
            
            handleSessionExpiry() {
                alert('세션이 만료되었습니다. 다시 로그인해주세요.');
                this.logout();
            }
            
            logout() {
                this.destroySession();
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('dashboard').style.display = 'none';
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }
        }
        
        // 전역 보안 관리자 인스턴스
        const security = new SecurityManager();
        
        // 🔐 UI 함수들
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.innerHTML = `<div class="error-message">${message}</div>`;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }
        
        function showSuccess(message) {
            const resultDiv = document.getElementById('actionResult');
            resultDiv.innerHTML = `<div class="success-message">${message}</div>`;
            setTimeout(() => {
                resultDiv.innerHTML = '';
            }, 3000);
        }
        
        function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            
            console.log(`🔐 로그인 시도: ID="${username}", PW="${password}"`);
            
            if (!username || !password) {
                showError('사용자 ID와 비밀번호를 모두 입력해주세요.');
                return;
            }
            
            const result = security.authenticateUser(username, password);
            console.log('인증 결과:', result);
            
            if (result.success) {
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
                document.getElementById('sessionInfo').style.display = 'block';
                
                document.getElementById('userInfo').textContent = `사용자: ${username}`;
                document.getElementById('sessionDetails').innerHTML = `
                    세션 토큰: ${security.sessionToken.substring(0, 16)}...<br>
                    만료 시간: ${new Date(security.sessionExpiry).toLocaleString('ko-KR')}
                    ${result.isTemp ? '<br><span style="color: orange;">⚠️ 임시 계정 모드</span>' : ''}
                `;
                
                showSuccess(result.message || '보안 로그인 성공!');
                
                if (result.isTemp) {
                    showError('임시 계정으로 로그인되었습니다. 일부 기능이 제한될 수 있습니다.');
                }
            } else {
                showError(result.message);
                console.log('❌ 로그인 실패:', result.message);
            }
        }
        
        // 🔧 디버그 함수들 (콘솔에서 사용 가능)
        window.debugSecurity = {
            resetUsers: function() {
                console.log('🗑️ 모든 사용자 데이터 삭제 중...');
                localStorage.removeItem('secure_users');
                localStorage.removeItem('temp_users');
                security.initializeDefaultUsers();
                console.log('✅ 사용자 데이터 재설정 완료');
            },
            
            showStoredData: function() {
                console.log('💾 저장된 데이터:');
                console.log('Encrypted Users:', localStorage.getItem('secure_users'));
                console.log('Temp Users:', localStorage.getItem('temp_users'));
                
                try {
                    const users = security.loadEncryptedData('secure_users');
                    console.log('Decrypted Users:', users);
                } catch (error) {
                    console.log('복호화 실패:', error);
                }
            },
            
            createTestUser: function(id = 'test', pw = 'Test123!') {
                const result = security.createNewUser(id, pw, ['basic']);
                console.log('테스트 사용자 생성 결과:', result);
                return result;
            },
            
            testLogin: function(id = 'admin', pw = 'Admin123!@#') {
                const result = security.authenticateUser(id, pw);
                console.log('로그인 테스트 결과:', result);
                return result;
            }
        };
        
        // 페이지 로드 완료 후 추가 디버그 정보 출력
        setTimeout(() => {
            console.log('🔍 디버그 도구 사용법:');
            console.log('- debugSecurity.resetUsers() : 사용자 데이터 재설정');
            console.log('- debugSecurity.showStoredData() : 저장된 데이터 확인');
            console.log('- debugSecurity.testLogin("admin", "Admin123!@#") : 로그인 테스트');
            console.log('- debugSecurity.createTestUser("test", "Test123!") : 테스트 사용자 생성');
        }, 1000);
        
        function createUser() {
            if (!security.isSessionValid()) {
                showError('세션이 만료되었습니다.');
                return;
            }
            
            const username = prompt('새 사용자 ID를 입력하세요:');
            if (!username) return;
            
            const password = prompt('새 비밀번호를 입력하세요 (최소 8자, 대소문자, 숫자, 특수문자 포함):');
            if (!password) return;
            
            const result = security.createNewUser(username, password, ['basic']);
            
            if (result.success) {
                showSuccess(`사용자 '${username}' 생성 완료!`);
            } else {
                showError(result.message);
            }
        }
        
        function changePassword() {
            if (!security.isSessionValid()) {
                showError('세션이 만료되었습니다.');
                return;
            }
            
            const newPassword = prompt('새 비밀번호를 입력하세요 (최소 8자, 대소문자, 숫자, 특수문자 포함):');
            if (!newPassword) return;
            
            const result = security.changeUserPassword(security.currentUser, newPassword);
            
            if (result.success) {
                showSuccess('비밀번호가 성공적으로 변경되었습니다!');
            } else {
                showError(result.message);
            }
        }
        
        function encryptTestData() {
            if (!security.isSessionValid()) {
                showError('세션이 만료되었습니다.');
                return;
            }
            
            const testData = {
                members: [
                    { name: '김철수', age: 35, phone: '010-1234-5678' },
                    { name: '이영희', age: 28, phone: '010-9876-5432' }
                ],
                timestamp: new Date().toISOString()
            };
            
            try {
                security.saveEncryptedData('test_member_data', testData);
                const decrypted = security.loadEncryptedData('test_member_data');
                
                showSuccess(`
                    데이터 암호화/복호화 테스트 성공!<br>
                    원본 데이터: ${JSON.stringify(testData).substring(0, 50)}...<br>
                    복호화 데이터: ${JSON.stringify(decrypted).substring(0, 50)}...
                `);
            } catch (error) {
                showError(`암호화 테스트 실패: ${error.message}`);
            }
        }
        
        function showSecurityLogs() {
            if (!security.isSessionValid()) {
                showError('세션이 만료되었습니다.');
                return;
            }
            
            const logDisplay = document.getElementById('logDisplay');
            let logHtml = '<h4>🔐 보안 로그</h4>';
            
            security.securityLogs.slice(-20).forEach(log => {
                logHtml += `
                    <div style="margin-bottom: 10px; padding: 5px; border-left: 3px solid #4caf50;">
                        [${new Date(log.timestamp).toLocaleString('ko-KR')}] 
                        <strong>${log.event}</strong>: ${log.message}
                        ${log.user ? `(사용자: ${log.user})` : ''}
                    </div>
                `;
            });
            
            logDisplay.innerHTML = logHtml;
            logDisplay.style.display = 'block';
            
            setTimeout(() => {
                logDisplay.style.display = 'none';
            }, 10000);
        }
        
        function logout() {
            security.logout();
            showSuccess('안전하게 로그아웃되었습니다.');
        }
        
        // Enter 키 이벤트 처리
        document.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                if (document.getElementById('loginSection').style.display !== 'none') {
                    login();
                }
            }
        });
        
        // 페이지 로드 시 보안 경고
        console.log('%c🔒 보안 강화 시스템 활성화됨', 'color: red; font-size: 20px; font-weight: bold;');
        console.log('%c무단 접근을 시도하면 보안 로그에 기록됩니다!', 'color: orange; font-size: 16px;');
        
        // 개발자 도구 감지 (기본적인 보안)
        let devtools = {
            open: false,
            orientation: null
        };
        
        const threshold = 160;
        
        setInterval(() => {
            if (window.outerHeight - window.innerHeight > threshold || 
                window.outerWidth - window.innerWidth > threshold) {
                if (!devtools.open) {
                    devtools.open = true;
                    security.logSecurityEvent('DEVTOOLS_OPENED', '개발자 도구가 열렸습니다');
                    console.clear();
                    console.log('%c⚠️ 경고: 개발자 도구 사용이 감지되었습니다!', 'color: red; font-size: 18px; font-weight: bold;');
                    console.log('%c모든 활동이 보안 로그에 기록됩니다.', 'color: orange; font-size: 14px;');
                }
            } else {
                if (devtools.open) {
                    devtools.open = false;
                    security.logSecurityEvent('DEVTOOLS_CLOSED', '개발자 도구가 닫혔습니다');
                }
            }
        }, 500);
        
        // 콘솔 접근 시도 감지
        const originalLog = console.log;
        console.log = function(...args) {
            security.logSecurityEvent('CONSOLE_ACCESS', `콘솔 사용 감지: ${args.join(' ')}`);
            return originalLog.apply(console, args);
        };
        
        // 마우스 우클릭 방지 (기본적인 보안)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            security.logSecurityEvent('RIGHT_CLICK_BLOCKED', '우클릭이 차단되었습니다');
            return false;
        });
        
        // F12 키 방지
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12' || 
                (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                (e.ctrlKey && e.shiftKey && e.key === 'J') ||
                (e.ctrlKey && e.key === 'U')) {
                e.preventDefault();
                security.logSecurityEvent('HOTKEY_BLOCKED', `금지된 키 조합 차단: ${e.key}`);
                return false;
            }
        });
        
        // 페이지 숨김/표시 감지 (다른 탭으로 이동 감지)
        document.addEventListener('visibilitychange', function() {
            if (document.hidden) {
                security.logSecurityEvent('PAGE_HIDDEN', '페이지가 숨겨짐 (다른 탭으로 이동)');
            } else {
                security.logSecurityEvent('PAGE_VISIBLE', '페이지가 다시 표시됨');
            }
        });
        
        // 브라우저 창 크기 변경 감지 (개발자 도구 감지 추가)
        window.addEventListener('resize', function() {
            security.logSecurityEvent('WINDOW_RESIZE', `창 크기 변경: ${window.innerWidth}x${window.innerHeight}`);
        });
        
        // 페이지 언로드 시 세션 정리
        window.addEventListener('beforeunload', function() {
            if (security.currentUser) {
                security.logSecurityEvent('PAGE_UNLOAD', '페이지 언로드 - 세션 정리');
            }
        });
        
    </script>
    
    <!-- 추가 보안 스타일 -->
    <style>
        /* 드래그 방지 */
        * {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        /* 입력 필드는 선택 가능하도록 */
        input, textarea {
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
            user-select: text;
        }
        
        /* 이미지 드래그 방지 */
        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
        }
        
        /* 보안 워터마크 */
        body::before {
            content: "🔒 SECURE SYSTEM";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 100px;
            color: rgba(0, 0, 0, 0.05);
            z-index: -1;
            pointer-events: none;
            font-weight: bold;
        }
        
        /* 콘솔 경고 스타일 */
        .console-warning {
            background: linear-gradient(45deg, #ff6b6b, #ee5a52);
            color: white;
            padding: 20px;
            text-align: center;
            font-weight: bold;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
            display: none;
        }
    </style>
    
    <div class="console-warning" id="consoleWarning">
        ⚠️ 무단 접근이 감지되었습니다! 모든 활동이 기록됩니다.
    </div>
    
</body>
</html>
