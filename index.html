    <!-- Firebase SDK - 모바일 최적화 버전 -->
    <script>
        // 모바일 Firebase 연결 상태 관리
        let isOnlineMode = false;
        let firebaseInitialized = false;
        let memberData = [];
        let columnSettings = { name: 1, dob: 2, phone: 3, dong: 4 };
        
        // 기본 사용자 계정 (Firebase 연결 실패 시 사용)
        let defaultUsers = {
            'admin': { password: 'admin123', permissions: ['생일검색', '당원검색'] },
            'user': { password: 'user123', permissions: ['생일검색', '당원검색'] }
        };

        // 데이터 서버 초기화 시도 (모바일 최적화 강화)
        async function initializeFirebaseForMobile() {
            let attemptCount = 0;
            const maxAttempts = 3;
            
            while (attemptCount < maxAttempts) {
                attemptCount++;
                updateConnectionStatus(false, `데이터 서버 연결 시도 중... (${attemptCount}/${maxAttempts})`);
                
                try {
                    // 네트워크 상태 재확인
                    if (!navigator.onLine) {
                        throw new Error('인터넷 연결이 없습니다.');
                    }

                    // 모바일 브라우저 감지 및 최적화
                    const isMobileBrowser = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
                    const timeout = isMobileBrowser ? 15000 : 8000; // 모바일은 더 긴 타임아웃

                    console.log(`🔄 연결 시도 ${attemptCount}: 모바일=${isMobileBrowser}, 타임아웃=${timeout}ms`);

                    // Firebase 모듈 로드 (여러 방법 시도)
                    let firebaseModules;
                    try {
                        // 방법 1: ES6 동적 import (권장)
                        firebaseModules = await loadFirebaseModules();
                    } catch (importError) {
                        console.warn('ES6 import 실패, CDN 방식 시도:', importError);
                        // 방법 2: CDN 스크립트 로드 (백업)
                        firebaseModules = await loadFirebaseViaCDN();
                    }

                    const { initializeApp, getFirestore, doc, getDoc } = firebaseModules;
                    
                    const firebaseConfig = {
                        apiKey: "AIzaSyAFAsd9XBblWD1G2vVrP48T9IQqwWoDZro",
                        authDomain: "wonju-minjoo-member-system.firebaseapp.com",
                        projectId: "wonju-minjoo-member-system",
                        storageBucket: "wonju-minjoo-member-system.firebasestorage.app",
                        messagingSenderId: "227156177261",
                        appId: "1:227156177261:web:9f37ea54dab14265c2aa64"
                    };

                    // Firebase 앱 초기화
                    const app = initializeApp(firebaseConfig);
                    const db = getFirestore(app);
                    
                    // 연결 테스트 (모바일 친화적 타임아웃)
                    const testPromise = testFirebaseConnection(db, doc, getDoc);
                    const timeoutPromise = new Promise((_, reject) => 
                        setTimeout(() => reject(new Error(`연결 시간 초과 (${timeout}ms)`)), timeout)
                    );
                    
                    await Promise.race([testPromise, timeoutPromise]);
                    
                    // 성공 시 전역 변수 설정
                    window.firebaseDB = db;
                    window.firebaseUtils = { doc, getDoc };
                    isOnlineMode = true;
                    firebaseInitialized = true;
                    
                    updateConnectionStatus(true, '데이터 연결 성공');
                    console.log('✅ 데이터 서버 모바일 연결 성공');
                    
                    // 데이터 로드 시도
                    await loadMemberDataFromFirebase();
                    
                    return true;
                    
                } catch (error) {
                    console.error(`❌ 연결 시도 ${attemptCount} 실패:`, error);
                    
                    if (attemptCount < maxAttempts) {
                        // 재시도 전 잠시 대기 (지수 백오프)
                        const waitTime = Math.pow(2, attemptCount) * 1000;
                        updateConnectionStatus(false, `${waitTime/1000}초 후 재시도...`);
                        await new Promise(resolve => setTimeout(resolve, waitTime));
                    } else {
                        // 모든 시도 실패
                        updateConnectionStatus(false, `연결 실패: ${error.message}`);
                        return false;
                    }
                }
            }
            
            return false;
        }

        // Firebase 모듈 로드 (ES6 import)
        async function loadFirebaseModules() {
            const [appModule, firestoreModule] = await Promise.all([
                import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js'),
                import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js')
            ]);
            
            return {
                initializeApp: appModule.initializeApp,
                getFirestore: firestoreModule.getFirestore,
                doc: firestoreModule.doc,
                getDoc: firestoreModule.getDoc
            };
        }

        // Firebase CDN 로드 (백업 방법)
        async function loadFirebaseViaCDN() {
            return new Promise((resolve, reject) => {
                // 이미 로드된 경우 바로 반환
                if (window.firebase && window.firebase.firestore) {
                    const db = window.firebase.firestore();
                    resolve({
                        initializeApp: window.firebase.initializeApp,
                        getFirestore: () => db,
                        doc: (database, path, id) => database.doc(`${path}/${id}`),
                        getDoc: (docRef) => docRef.get()
                    });
                    return;
                }

                // 스크립트 동적 로드
                const script = document.createElement('script');
                script.src = 'https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js';
                script.onload = () => {
                    const firestoreScript = document.createElement('script');
                    firestoreScript.src = 'https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js';
                    firestoreScript.onload = () => {
                        const db = window.firebase.firestore();
                        resolve({
                            initializeApp: window.firebase.initializeApp,
                            getFirestore: () => db,
                            doc: (database, path, id) => database.doc(`${path}/${id}`),
                            getDoc: (docRef) => docRef.get()
                        });
                    };
                    firestoreScript.onerror = () => reject(new Error('Firestore CDN 로드 실패'));
                    document.head.appendChild(firestoreScript);
                };
                script.onerror = () => reject(new Error('Firebase CDN 로드 실패'));
                document.head.appendChild(script);
                
                // 타임아웃
                setTimeout(() => reject(new Error('CDN 로드 시간 초과')), 10000);
            });
        }

        // Firebase 연결 테스트
        async function testFirebaseConnection(db, doc, getDoc) {
            const testDoc = doc(db, 'system', 'connectionTest');
            const docSnap = await getDoc(testDoc);
            return true; // 에러가 없으면 연결 성공
        }

        // 데이터 서버에서 멤버 데이터 로드
        async function loadMemberDataFromFirebase() {
            try {
                if (!window.firebaseDB || !window.firebaseUtils) return false;
                
                const { doc, getDoc } = window.firebaseUtils;
                const memberDoc = doc(window.firebaseDB, 'system', 'memberData');
                const docSnap = await getDoc(memberDoc);
                
                if (docSnap.exists) {
                    const data = docSnap.data();
                    memberData = data.data || [];
                    columnSettings = data.columnSettings || columnSettings;
                    
                    // 로컬 저장소에 백업
                    localStorage.setItem('memberData_backup', JSON.stringify({
                        data: memberData,
                        columnSettings: columnSettings,
                        timestamp: Date.now()
                    }));
                    
                    console.log(`✅ 데이터 로드 완료 (${data.totalMembers || memberData.length - 1}명)`);
                    return true;
                } else {
                    throw new Error('당원 데이터를 찾을 수 없습니다.');
                }
            } catch (error) {
                console.error('데이터 로드 실패:', error);
                
                // 로컬 백업 데이터 사용 시도
                return loadBackupData();
            }
        }

        // 백업 데이터 로드
        function loadBackupData() {
            try {
                const backup = localStorage.getItem('memberData_backup');
                if (backup) {
                    const backupData = JSON.parse(backup);
                    memberData = backupData.data;
                    columnSettings = backupData.columnSettings;
                    
                    const backupDate = new Date(backupData.timestamp).toLocaleDateString('ko-KR');
                    console.log(`✅ 백업 데이터 사용 중 (${backupDate})`);
                    return true;
                }
                
                // 백업도 없으면 빈 데이터로 설정
                memberData = [['이름', '생년월일', '전화번호', '읍면동']]; // 헤더만
                console.log('📋 빈 데이터로 초기화');
                return false;
            } catch (error) {
                console.error('백업 데이터 로드 실패:', error);
                memberData = [['이름', '생년월일', '전화번호', '읍면동']]; // 헤더만
                console.log('📋 오류로 인한 빈 데이터 초기화');
                return false;
            }
        }

        // 연결 상태 업데이트
        function updateConnectionStatus(isConnected, message) {
            const statusElement = document.getElementById('connectionStatus');
            if (statusElement) {
                if (isConnected) {
                    statusElement.innerHTML = `<span style="color: #28a745;">🟢 ${message}</span>`;
                    statusElement.style.background = '#d4edda';
                    statusElement.style.borderColor = '#c3e6cb';
                    statusElement.style.color = '#155724';
                } else {
                    statusElement.innerHTML = `<span style="color: #dc3545;">🔴 ${message}</span>`;
                    statusElement.style.background = '#f8d7da';
                    statusElement.style.borderColor = '#f5c6cb';
                    statusElement.style.color = '#721c24';
                }
            }
        }

        // 연결 재시도
        async function retryConnection() {
            if (!navigator.onLine) {
                showToast('📵 인터넷 연결을 먼저 확인해주세요', 'error');
                return;
            }
            
            updateConnectionStatus(false, '재연결 시도 중...');
            showToast('🔄 데이터 서버 재연결을 시도합니다...', 'info');
            
            const success = await initializeFirebaseForMobile();
            
            if (success) {
                showToast('✅ 데이터 서버 연결 성공!', 'success');
            } else {
                showToast('❌ 재연결 실패. 관리자에게 문의하세요', 'error');
            }
        }

        // 네트워크 상태 모니터링
        function setupNetworkMonitoring() {
            // 온라인/오프라인 이벤트 모니터링 (알림만)
            window.addEventListener('online', async () => {
                console.log('📶 네트워크 연결됨');
                showToast('📶 네트워크가 연결되었습니다', 'info');
            });

            window.addEventListener('offline', () => {
                console.log('📵 네트워크 연결 해제됨');
                showToast('📵 네트워크 연결이 해제되었습니다', 'error');
            });
        }

        // 페이지 로드 시 초기화
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('📱 모바일 최적화 시스템 시작');
            
            // 모바일 디바이스 감지 및 표시
            isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            console.log(`📱 모바일 디바이스: ${isMobileDevice ? 'Yes' : 'No'}`);
            console.log(`🌐 온라인 상태: ${navigator.onLine ? 'Yes' : 'No'}`);
            
            // 네트워크 모니터링 설정
            setupNetworkMonitoring();
            
            // 초기 연결 상태 메시지
            if (!navigator.onLine) {
                updateConnectionStatus(false, '인터넷 연결이 없습니다');
            } else {
                // 데이터 서버 초기화 시도
                updateConnectionStatus(false, '데이터 서버 연결 시도 중...');
                await initializeFirebaseForMobile();
            }
            
            // 기타 초기화
            initializeMobileOptimizations();
            setupEventListeners();
        });
    </script>

</head>

    <script>
        // 전역 변수
        let currentUser = '';
        let currentTabIndex = 0;
        let isMobileDevice = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // 이벤트 리스너 설정
        function setupEventListeners() {
            // Enter 키로 로그인
            document.getElementById('password').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    login();
                }
            });
        }

        // 모바일 최적화 기능 초기화
        function initializeMobileOptimizations() {
            if (isMobileDevice) {
                setupTouchNavigation();
                document.body.classList.add('mobile-device');
            }
            
            setupVirtualKeyboardHandling();
            setupOrientationChange();
            setupTouchFeedback();
            
            console.log('📱 모바일 최적화 기능 로드 완료');
        }

        // 터치 네비게이션 설정
        function setupTouchNavigation() {
            let startX = 0;
            let startY = 0;
            let isScrolling = false;
            
            document.addEventListener('touchstart', (e) => {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
                isScrolling = false;
            });
            
            document.addEventListener('touchmove', (e) => {
                if (!startX || !startY) return;
                
                const diffX = Math.abs(e.touches[0].clientX - startX);
                const diffY = Math.abs(e.touches[0].clientY - startY);
                
                if (diffY > diffX) {
                    isScrolling = true;
                }
            });
            
            document.addEventListener('touchend', (e) => {
                if (!startX || !startY || isScrolling) return;
                
                const endX = e.changedTouches[0].clientX;
                const diffX = startX - endX;
                const tabButtons = document.querySelectorAll('.tab-btn');
                
                if (Math.abs(diffX) > 80) {
                    if (diffX > 0 && currentTabIndex < tabButtons.length - 1) {
                        currentTabIndex++;
                        tabButtons[currentTabIndex].click();
                    } else if (diffX < 0 && currentTabIndex > 0) {
                        currentTabIndex--;
                        tabButtons[currentTabIndex].click();
                    }
                }
                
                startX = 0;
                startY = 0;
            });
        }

        // 가상 키보드 처리
        function setupVirtualKeyboardHandling() {
            const viewport = document.querySelector('meta[name=viewport]');
            let originalContent = viewport.getAttribute('content');
            
            document.addEventListener('focusin', (e) => {
                if (e.target.matches('input, textarea, select')) {
                    if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                        viewport.setAttribute('content', 
                            'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0');
                    }
                    
                    setTimeout(() => {
                        e.target.scrollIntoView({ 
                            behavior: 'smooth', 
                            block: 'center' 
                        });
                    }, 300);
                }
            });
            
            document.addEventListener('focusout', (e) => {
                if (/iPhone|iPad|iPod/i.test(navigator.userAgent)) {
                    viewport.setAttribute('content', originalContent);
                }
            });
        }

        // 화면 회전 대응
        function setupOrientationChange() {
            window.addEventListener('orientationchange', () => {
                setTimeout(() => {
                    window.scrollTo(0, 0);
                    const navTabs = document.querySelector('.nav-tabs');
                    if (navTabs) {
                        navTabs.scrollLeft = 0;
                    }
                }, 100);
            });
        }

        // 터치 피드백 설정
        function setupTouchFeedback() {
            document.addEventListener('touchstart', (e) => {
                if (e.target.matches('.btn, .member-item, .tab-btn, .radio-group label')) {
                    e.target.style.transform = 'scale(0.98)';
                    e.target.style.opacity = '0.8';
                }
            });
            
            document.addEventListener('touchend', (e) => {
                if (e.target.matches('.btn, .member-item, .tab-btn, .radio-group label')) {
                    setTimeout(() => {
                        e.target.style.transform = '';
                        e.target.style.opacity = '';
                    }, 150);
                }
            });
        }

        // 토스트 메시지 표시
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            const bgColor = type === 'success' ? 'rgba(40, 167, 69, 0.95)' : 
                           type === 'error' ? 'rgba(220, 53, 69, 0.95)' : 
                           'rgba(0, 123, 255, 0.95)';
            
            toast.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                background: ${bgColor};
                color: white;
                padding: 12px 20px;
                border-radius: 25px;
                font-size: 0.9em;
                z-index: 1001;
                animation: toastSlide 0.3s ease-out;
                max-width: 90%;
                text-align: center;
            `;
            toast.textContent = message;
            
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        // 로그인 함수
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showToast('사용자 ID와 비밀번호를 모두 입력하세요.', 'error');
                return;
            }

            const loginBtn = document.querySelector('.btn-primary');
            const originalText = loginBtn.textContent;
            loginBtn.textContent = '로그인 중...';
            loginBtn.disabled = true;

            try {
                let isValidUser = false;
                let loginMethod = '';
                
                // 1. 기본 계정 먼저 확인 (빠르고 확실함)
                if (defaultUsers[username] && defaultUsers[username].password === password) {
                    isValidUser = true;
                    loginMethod = '기본 계정';
                    console.log('✅ 기본 계정 로그인 성공:', username);
                }
                
                // 2. 기본 계정 로그인 실패 시 Firebase 온라인 로그인 시도
                if (!isValidUser && isOnlineMode && window.firebaseDB) {
                    try {
                        const { doc, getDoc } = window.firebaseUtils;
                        const userDoc = doc(window.firebaseDB, 'authorizedUsers', username);
                        const userSnap = await getDoc(userDoc);

                        if (userSnap.exists) {
                            const userData = userSnap.data();
                            if (userData.hashedPassword && userData.isActive) {
                                const decodedPassword = atob(userData.hashedPassword);
                                if (decodedPassword === password) {
                                    isValidUser = true;
                                    loginMethod = 'Firebase 온라인';
                                    console.log('✅ Firebase 온라인 로그인 성공:', username);
                                }
                            }
                        }
                    } catch (firebaseError) {
                        console.error('Firebase 로그인 오류:', firebaseError);
                        // Firebase 오류는 무시하고 계속 진행
                    }
                }
                
                if (!isValidUser) {
                    throw new Error('사용자 ID 또는 비밀번호가 올바르지 않습니다.');
                }

                // 로그인 성공
                currentUser = username;
                
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'flex';
                document.getElementById('currentUser').style.display = 'block';
                document.getElementById('currentUser').textContent = `${username}님`;
                document.getElementById('logoutBtn').style.display = 'block';
                
                const modeText = isOnlineMode ? '온라인' : '로컬';
                showToast(`✅ ${username}님 환영합니다! (${loginMethod} - ${modeText})`);
                
                console.log(`✅ ${username}님 로그인 성공 (${loginMethod} - ${modeText})`);
                
            } catch (error) {
                console.error('로그인 오류:', error);
                showToast(error.message, 'error');
            } finally {
                loginBtn.textContent = originalText;
                loginBtn.disabled = false;
            }
        }

        // 탭 전환
        function showTab(tabName) {
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach((btn, index) => {
                btn.classList.remove('active');
                if (btn === event.target) {
                    currentTabIndex = index;
                }
            });
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
            
            // 활성 탭을 화면 중앙으로 스크롤
            const navTabs = document.querySelector('.nav-tabs');
            const activeTab = event.target;
            const scrollLeft = activeTab.offsetLeft - (navTabs.clientWidth / 2) + (activeTab.clientWidth / 2);
            navTabs.scrollTo({
                left: scrollLeft,
                behavior: 'smooth'
            });
        }

        // 필터 토글 함수들
        function toggleDateOptions() {
            const dateOption = document.querySelector('input[name="dateOption"]:checked').value;
            const specificDate = document.getElementById('specificDate');
            
            if (dateOption === 'specific') {
                specificDate.style.display = 'block';
                specificDate.value = new Date().toISOString().split('T')[0];
            } else {
                specificDate.style.display = 'none';
            }
        }

        function toggleAgeFilter() {
            const ageFilter = document.querySelector('input[name="ageFilter"]:checked').value;
            const ageRange = document.getElementById('ageRange');
            
            if (ageFilter === 'specific') {
                ageRange.style.display = 'block';
            } else {
                ageRange.style.display = 'none';
            }
        }

        function toggleDongFilter() {
            const dongFilter = document.querySelector('input[name="dongFilter"]:checked').value;
            const specificDong = document.getElementById('specificDong');
            
            if (dongFilter === 'specific') {
                specificDong.style.display = 'block';
            } else {
                specificDong.style.display = 'none';
            }
        }

        function toggleMemberFilters() {
            const ageFilter = document.querySelector('input[name="memberAgeFilter"]:checked').value;
            const dongFilter = document.querySelector('input[name="memberDongFilter"]:checked').value;
            
            document.getElementById('memberAgeRange').style.display = ageFilter === 'specific' ? 'block' : 'none';
            document.getElementById('memberSpecificDong').style.display = dongFilter === 'specific' ? 'block' : 'none';
        }

        // 유틸리티 함수들
        function calculateAge(dobString) {
            try {
                const dob = new Date(dobString);
                const today = new Date();
                let age = today.getFullYear() - dob.getFullYear();
                const monthDiff = today.getMonth() - dob.getMonth();
                
                if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < dob.getDate())) {
                    age--;
                }
                return age;
            } catch {
                return 0;
            }
        }

        function getAgeGroup(age) {
            if (age < 20) return '10대';
            if (age < 30) return '20대';
            if (age < 40) return '30대';
            if (age < 50) return '40대';
            if (age < 60) return '50대';
            if (age < 70) return '60대';
            if (age < 80) return '70대';
            return '80대 이상';
        }

        function formatPhoneNumber(phone) {
            if (!phone) return '';
            const cleaned = phone.toString().replace(/\D/g, '');
            if (cleaned.length === 11) {
                return cleaned.replace(/(\d{3})(\d{4})(\d{4})/, '$1-$2-$3');
            }
            return phone;
        }

        // 생일 검색
        function searchBirthdays() {
            if (!memberData || memberData.length <= 1) {
                if (isOnlineMode) {
                    showToast('당원 데이터가 아직 로드되지 않았습니다. 잠시 후 다시 시도하세요.', 'error');
                } else {
                    showToast('데이터 서버에 연결되지 않았습니다. 연결을 확인하세요.', 'error');
                }
                return;
            }

            const searchBtn = event.target;
            const originalText = searchBtn.textContent;
            searchBtn.textContent = '🔍 검색 중...';
            searchBtn.disabled = true;

            setTimeout(() => {
                try {
                    const dateOption = document.querySelector('input[name="dateOption"]:checked').value;
                    const ageFilter = document.querySelector('input[name="ageFilter"]:checked').value;
                    const dongFilter = document.querySelector('input[name="dongFilter"]:checked').value;
                    
                    let targetDate = new Date();
                    if (dateOption === 'specific') {
                        targetDate = new Date(document.getElementById('specificDate').value);
                    }

                    const results = [];
                    
                    for (let i = 1; i < memberData.length; i++) {
                        const row = memberData[i];
                        if (!row || row.length === 0) continue;
                        
                        const name = row[columnSettings.name - 1] || '';
                        const dobStr = row[columnSettings.dob - 1] || '';
                        const phone = row[columnSettings.phone - 1] || '';
                        const dong = row[columnSettings.dong - 1] || '';
                        
                        if (!name || !dobStr) continue;
                        
                        try {
                            const dob = new Date(dobStr);
                            const isBirthday = dob.getMonth() === targetDate.getMonth() && 
                                             dob.getDate() === targetDate.getDate();
                            
                            if (!isBirthday) continue;
                            
                            const age = calculateAge(dobStr);
                            const ageGroup = getAgeGroup(age);
                            
                            // 연령대 필터
                            if (ageFilter === 'specific') {
                                const selectedAge = document.getElementById('ageRange').value;
                                if (ageGroup !== selectedAge) continue;
                            }
                            
                            // 읍면동 필터
                            if (dongFilter === 'specific') {
                                const selectedDong = document.getElementById('specificDong').value;
                                if (dong.indexOf(selectedDong) === -1) continue;
                            }
                            
                            results.push({ name, dob: dobStr, phone, dong, age });
                        } catch (e) {
                            continue;
                        }
                    }

                    displayBirthdayResults(results, targetDate);
                    showToast(`🔍 검색 완료: ${results.length}명 발견`);
                    
                } finally {
                    searchBtn.textContent = originalText;
                    searchBtn.disabled = false;
                }
            }, 100);
        }

        // 생일 검색 결과 표시
        function displayBirthdayResults(results, targetDate) {
            const container = document.getElementById('birthdayResults');
            
            const ageFilter = document.querySelector('input[name="ageFilter"]:checked').value;
            const dongFilter = document.querySelector('input[name="dongFilter"]:checked').value;
            
            let conditionText = '';
            if (ageFilter === 'specific') {
                conditionText += ` / ${document.getElementById('ageRange').value} 대상`;
            }
            if (dongFilter === 'specific') {
                conditionText += ` / ${document.getElementById('specificDong').value} 지역`;
            }
            
            let html = `<div class="results-header">
                ${targetDate.toLocaleDateString('ko-KR')} 생일자<br>${results.length}명${conditionText}
            </div>`;
            
            if (results.length === 0) {
                html += '<div class="no-data">해당 조건에 맞는<br>생일자가 없습니다.</div>';
            } else {
                results.forEach((member, index) => {
                    const displayParts = [member.name, new Date(member.dob).toLocaleDateString('ko-KR')];
                    
                    if (member.phone && columnSettings.phone > 0) {
                        displayParts.push(formatPhoneNumber(member.phone));
                    }
                    if (member.dong && columnSettings.dong > 0) {
                        displayParts.push(member.dong);
                    }
                    
                    html += `<div class="member-item">
                        <div class="member-name">${index + 1}. ${member.name}</div>
                        <div class="member-details">${displayParts.slice(1).join(' / ')}<br>${member.age}세 (${getAgeGroup(member.age)})</div>
                    </div>`;
                });
            }
            
            container.innerHTML = html;
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 당원 검색
        function searchMembers() {
            if (!memberData || memberData.length <= 1) {
                if (isOnlineMode) {
                    showToast('당원 데이터가 아직 로드되지 않았습니다. 잠시 후 다시 시도하세요.', 'error');
                } else {
                    showToast('데이터 서버에 연결되지 않았습니다. 연결을 확인하세요.', 'error');
                }
                return;
            }

            const searchBtn = event.target;
            const originalText = searchBtn.textContent;
            searchBtn.textContent = '🔍 검색 중...';
            searchBtn.disabled = true;

            setTimeout(() => {
                try {
                    const ageFilter = document.querySelector('input[name="memberAgeFilter"]:checked').value;
                    const dongFilter = document.querySelector('input[name="memberDongFilter"]:checked').value;
                    
                    const results = [];
                    
                    for (let i = 1; i < memberData.length; i++) {
                        const row = memberData[i];
                        if (!row || row.length === 0) continue;
                        
                        const name = row[columnSettings.name - 1] || '';
                        const dobStr = row[columnSettings.dob - 1] || '';
                        const phone = row[columnSettings.phone - 1] || '';
                        const dong = row[columnSettings.dong - 1] || '';
                        
                        if (!name || !dobStr) continue;
                        
                        const age = calculateAge(dobStr);
                        const ageGroup = getAgeGroup(age);
                        
                        // 연령대 필터
                        if (ageFilter === 'specific') {
                            const selectedAge = document.getElementById('memberAgeRange').value;
                            if (ageGroup !== selectedAge) continue;
                        }
                        
                        // 읍면동 필터
                        if (dongFilter === 'specific') {
                            const selectedDong = document.getElementById('memberSpecificDong').value;
                            if (dong.indexOf(selectedDong) === -1) continue;
                        }
                        
                        results.push({ name, dob: dobStr, phone, dong, age, ageGroup });
                    }

                    displayMemberResults(results);
                    showToast(`🔍 검색 완료: ${results.length}명 발견`);
                    
                } finally {
                    searchBtn.textContent = originalText;
                    searchBtn.disabled = false;
                }
            }, 100);
        }

        // 당원 검색 결과 표시
        function displayMemberResults(results) {
            const container = document.getElementById('memberSearchResults');
            
            const ageFilter = document.querySelector('input[name="memberAgeFilter"]:checked').value;
            const dongFilter = document.querySelector('input[name="memberDongFilter"]:checked').value;
            
            let conditionText = '';
            if (ageFilter === 'specific') {
                conditionText += ` / ${document.getElementById('memberAgeRange').value} 대상`;
            }
            if (dongFilter === 'specific') {
                conditionText += ` / ${document.getElementById('memberSpecificDong').value} 지역`;
            }
            
            let html = `<div class="results-header">
                검색된 당원<br>${results.length}명${conditionText}
            </div>`;
            
            if (results.length === 0) {
                html += '<div class="no-data">해당 조건에 맞는<br>당원이 없습니다.</div>';
            } else {
                results.forEach((member, index) => {
                    const displayParts = [member.name, new Date(member.dob).toLocaleDateString('ko-KR')];
                    
                    if (member.phone && columnSettings.phone > 0) {
                        displayParts.push(formatPhoneNumber(member.phone));
                    }
                    if (member.dong && columnSettings.dong > 0) {
                        displayParts.push(member.dong);
                    }
                    
                    html += `<div class="member-item">
                        <div class="member-name">${index + 1}. ${member.name}</div>
                        <div class="member-details">${displayParts.slice(1).join(' / ')}<br>${member.age}세 (${member.ageGroup})</div>
                    </div>`;
                });
            }
            
            container.innerHTML = html;
            container.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 결과 인쇄
        function printResults(type) {
            if (isMobileDevice) {
                const confirmPrint = confirm(
                    '📱 모바일에서 인쇄 기능을 실행합니다.\n\n' +
                    '• 브라우저 메뉴에서 인쇄를 선택하세요\n' +
                    '• 일부 브라우저에서는 제한될 수 있습니다\n\n' +
                    '계속하시겠습니까?'
                );
                
                if (!confirmPrint) return;
            }
            
            let containerId = '';
            let title = '';
            
            if (type === 'birthday') {
                containerId = 'birthdayResults';
                title = '생일자 검색 결과';
            } else if (type === 'member') {
                containerId = 'memberSearchResults';
                title = '당원 검색 결과';
            }
            
            const container = document.getElementById(containerId);
            const content = container.innerHTML;
            
            if (!content || content.includes('없습니다') || content.includes('검색 버튼을')) {
                showToast('인쇄할 결과가 없습니다. 먼저 검색을 수행해주세요.', 'error');
                return;
            }
            
            const printDate = new Date().toLocaleString('ko-KR');
            const modeText = isOnlineMode ? '온라인' : '로컬';
            const printHeader = `
                <div class="print-header">
                    <div class="print-title">더불어민주당 원주갑지역위원회</div>
                    <div class="print-title">${title}</div>
                    <div class="print-info">
                        출력일시: ${printDate} | 
                        검색자: ${currentUser} | 
                        모드: ${modeText} | 
                        시스템: 당원검색시스템
                    </div>
                </div>
            `;
            
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>${title} - 더불어민주당 원주갑</title>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <style>
                        * { margin: 0; padding: 0; box-sizing: border-box; }
                        body { font-family: 'Malgun Gothic', Arial, sans-serif; line-height: 1.4; color: black; background: white; padding: 10px; }
                        .print-header { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 3px double black; }
                        .print-title { font-size: 18px; font-weight: bold; margin-bottom: 10px; }
                        .print-info { font-size: 11px; color: #666; }
                        .results-header { color: black; font-size: 16px; font-weight: bold; text-align: center; margin-bottom: 20px; padding: 10px 0; border-bottom: 2px solid black; }
                        .member-item { background: white; border: 1px solid #ccc; border-left: 4px solid #007bff; margin-bottom: 8px; padding: 10px; page-break-inside: avoid; }
                        .member-name { font-weight: bold; font-size: 13px; color: black; margin-bottom: 5px; }
                        .member-details { font-size: 11px; color: #333; line-height: 1.5; }
                        .no-data { text-align: center; padding: 40px; font-size: 14px; color: black; }
                        @media print {
                            body { padding: 0; }
                            .print-title { font-size: 16px; }
                            .member-item { margin-bottom: 5px; padding: 8px; }
                        }
                    </style>
                </head>
                <body>
                    ${printHeader}
                    <div class="print-content">
                        ${content}
                    </div>
                </body>
                </html>
            `);
            
            printWindow.document.close();
            
            printWindow.onload = function() {
                setTimeout(() => {
                    try {
                        printWindow.print();
                        if (isMobileDevice) {
                            setTimeout(() => showToast('인쇄 대화상자를 확인하세요'), 1000);
                        } else {
                            setTimeout(() => printWindow.close(), 1000);
                        }
                    } catch (e) {
                        showToast('인쇄 기능을 사용할 수 없습니다. 브라우저 메뉴에서 인쇄를 선택해주세요.', 'error');
                    }
                }, 500);
            };
        }

        // 로그아웃
        function logout() {
            if (confirm('정말 로그아웃하시겠습니까?')) {
                currentUser = '';
                currentTabIndex = 0;
                
                document.getElementById('mainApp').style.display = 'none';
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('currentUser').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'none';
                
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
                
                showToast('✅ 로그아웃 완료');
                console.log('✅ 로그아웃 완료');
            }
        }

        // CSS 애니메이션 추가
        const style = document.createElement('style');
        style.textContent = `
            @keyframes toastSlide {
                from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
                to { opacity: 1; transform: translateX(-50%) translateY(0); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
