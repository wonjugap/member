<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>지인 찾기</title>
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      margin: 0; padding: 20px;
      background: #f5f7fa;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
    }
    #loginSection, #searchSection {
      max-width: 400px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0,0,0,0.1);
    }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0 20px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 16px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #007bff;
      border: none;
      color: white;
      font-size: 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      text-align: left;
      padding: 8px;
      border-bottom: 1px solid #ddd;
    }
    #logoutBtn {
      background: #dc3545;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h1>지인 찾기</h1>

  <!-- 로그인 화면 -->
  <section id="loginSection">
    <label for="passwordInput">비밀번호를 입력하세요:</label>
    <input type="password" id="passwordInput" placeholder="비밀번호" />
    <button id="loginBtn">로그인</button>
  </section>

  <!-- 검색 화면 (초기 숨김) -->
  <section id="searchSection" style="display:none;">
    <input type="text" id="searchInput" placeholder="이름을 입력하세요" />
    <table id="resultsTable" style="display:none;">
      <thead>
        <tr><th>이름</th><th>전화번호</th></tr>
      </thead>
      <tbody id="resultsBody"></tbody>
    </table>
    <button id="logoutBtn">로그아웃</button>
  </section>

  <!-- Firebase JS SDK -->
  <script type="module">
    // Firebase SDK Import
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

   // Firebase 프로젝트 설정
        const firebaseConfig = {
            apiKey: "AIzaSyAFAsd9XBblWD1G2vVrP48T9IQqwWoDZro",
            authDomain: "wonju-minjoo-member-system.firebaseapp.com",
            projectId: "wonju-minjoo-member-system",
            storageBucket: "wonju-minjoo-member-system.firebasestorage.app",
            messagingSenderId: "227156177261",
            appId: "1:227156177261:web:9f37ea54dab14265c2aa64"
        };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 클라이언트 단순 비밀번호 (보안이 약하니 참고용)
    const SIMPLE_PASSWORD = "1234";

    const loginSection = document.getElementById('loginSection');
    const searchSection = document.getElementById('searchSection');
    const passwordInput = document.getElementById('passwordInput');
    const loginBtn = document.getElementById('loginBtn');

    const searchInput = document.getElementById('searchInput');
    const resultsTable = document.getElementById('resultsTable');
    const resultsBody = document.getElementById('resultsBody');
    const logoutBtn = document.getElementById('logoutBtn');

    // 로그인 함수
    function login() {
      const pw = passwordInput.value.trim();
      if (pw === SIMPLE_PASSWORD) {
        passwordInput.value = "";
        loginSection.style.display = "none";
        searchSection.style.display = "block";
        searchInput.focus();
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    }

    loginBtn.addEventListener('click', login);
    passwordInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    // 로그아웃 함수
    logoutBtn.addEventListener('click', () => {
      searchSection.style.display = "none";
      loginSection.style.display = "block";
      resultsTable.style.display = "none";
      resultsBody.innerHTML = "";
      passwordInput.focus();
    });

    // 이름 검색 함수 (대소문자 무시, 포함 검색)
    async function searchName(name) {
      if (!name) {
        resultsTable.style.display = "none";
        resultsBody.innerHTML = "";
        return;
      }

      // Firestore에서 전체 contacts 불러온 후 클라이언트 필터링 (이름 포함)
      // Firestore 쿼리는 '=='만 지원해서
      const contactsCol = collection(db, "contacts");
      const snapshot = await getDocs(contactsCol);

      const results = [];
      const lowerName = name.toLowerCase();
      snapshot.forEach(doc => {
        const data = doc.data();
        if (data.name && data.name.toLowerCase().includes(lowerName)) {
          results.push(data);
        }
      });

      if (results.length === 0) {
        resultsTable.style.display = "none";
        resultsBody.innerHTML = "";
        return;
      }

      // 결과 테이블에 표시
      resultsBody.innerHTML = "";
      for (const item of results) {
        const tr = document.createElement('tr');
        const tdName = document.createElement('td');
        tdName.textContent = item.name;
        const tdPhone = document.createElement('td');
        tdPhone.textContent = item.phone || "-";
        tr.appendChild(tdName);
        tr.appendChild(tdPhone);
        resultsBody.appendChild(tr);
      }
      resultsTable.style.display = "table";
    }

    // 검색 입력 이벤트 (디바운스 적용)
    let debounceTimer = null;
    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        searchName(searchInput.value.trim());
      }, 300);
    });
  </script>

</body>
</html>
